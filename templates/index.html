<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BN-HTR — Bangla Handwriting Recognition</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- ui_version: {{ ui_version }} -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1916;
      --muted: #6b675f;
      --panel: #ffffff;
      --canvas: #f3f1ec;
      --accent: #0c5c45;
      --accent-deep: #084434;
      --accent-soft: #e7f3ee;
      --danger: #9f2d22;
      --warn: #8a5a12;
      --rule: rgba(26, 25, 22, 0.1);
      --shadow: 0 1px 2px rgba(26, 25, 22, 0.04), 0 12px 32px rgba(26, 25, 22, 0.06);
      --font-brand: "Instrument Serif", Georgia, serif;
      --font-ui: "Manrope", system-ui, sans-serif;
      --font-bn: "Noto Sans Bengali", "Manrope", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      color: var(--ink);
      font-family: var(--font-ui);
      background: var(--canvas);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      flex: 1;
      display: grid;
      grid-template-areas:
        "top"
        "status"
        "work"
        "foot";
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      height: 100vh;
      width: 100%;
      margin: 0;
    }

    .top { grid-area: top; }
    .status { grid-area: status; }
    .compare { grid-area: work; }
    .site-footer { grid-area: foot; }

    .top {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      align-items: center;
      gap: 1rem 1.5rem;
      padding: 0.85rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--rule);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
    }

    .mark {
      width: 2.15rem;
      height: 2.15rem;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--font-brand);
      font-size: 1.25rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-family: var(--font-brand);
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .brand h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .brand span {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .api-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.25rem 0.25rem 0.75rem;
      background: #faf9f6;
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    .api-wrap label {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .api-wrap input {
      width: min(240px, 28vw);
      border: 0;
      border-radius: 8px;
      padding: 0.48rem 0.35rem;
      font: 500 0.82rem var(--font-ui);
      background: transparent;
      color: var(--ink);
      outline: none;
      min-width: 140px;
    }

    .api-wrap input:focus {
      background: #fff;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      font: 650 0.82rem var(--font-ui);
      padding: 0.52rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .btn:focus-visible,
    .drop:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-deep);
    }

    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--rule);
    }

    .btn-ghost:hover:not(:disabled) {
      background: #f6f4ef;
      border-color: rgba(26, 25, 22, 0.18);
    }

    .api-wrap .btn-ghost {
      background: #fff;
      padding: 0.55rem 0.9rem;
    }

    .status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      width: 100%;
      min-height: 2.35rem;
      padding: 0.4rem 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      background: #faf9f6;
      border-bottom: 1px solid var(--rule);
    }

    .status:empty { display: none; padding: 0; min-height: 0; border: 0; }
    .status.error { color: var(--danger); background: #fdf6f4; }
    .status.busy { color: var(--accent-deep); font-weight: 650; }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    .col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .col + .col {
      border-left: 1px solid var(--rule);
    }

    .col-label {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 1.15rem;
      border-bottom: 1px solid var(--rule);
      background: #faf9f6;
    }

    .col-label strong {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .col-label em {
      font-style: normal;
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }

    .col-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      position: relative;
      background: #f3f1ec;
    }

    /* Source */
    .drop {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      cursor: pointer;
      background:
        linear-gradient(180deg, #f7f6f2 0%, #f3f1ec 100%);
    }

    .drop.dragover { background: var(--accent-soft); }

    .drop-card {
      width: min(22rem, 100%);
      padding: 1.6rem 1.4rem 1.4rem;
      text-align: center;
      border: 1px dashed rgba(26, 25, 22, 0.22);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      pointer-events: none;
    }

    .drop-icon {
      width: 2.4rem;
      height: 2.4rem;
      margin: 0 auto 0.75rem;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .drop input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-idle {
      text-align: center;
      pointer-events: none;
      color: var(--muted);
    }

    .drop-idle strong {
      display: block;
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .drop-idle span { font-size: 0.82rem; line-height: 1.45; }

    .preview {
      display: none;
      width: 100%;
      min-height: 100%;
      padding: 1.25rem;
      align-items: flex-start;
      justify-content: center;
      background: #f3f1ec;
    }

    .preview.show { display: flex; }

    .preview img {
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: var(--shadow);
      background: #fff;
      border: 1px solid var(--rule);
    }

    /* Transcript — reading-first */
    .reader-empty {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .reader-empty.hidden { display: none; }

    .transcript {
      display: none;
      max-width: 40rem;
      margin: 1.25rem auto 2rem;
      padding: 0.35rem 1.15rem 0.5rem;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .transcript.show { display: block; }

    .t-line {
      display: grid;
      grid-template-columns: 2.25rem 1fr;
      gap: 0.85rem;
      align-items: baseline;
      padding: 0.7rem 0;
      border-bottom: 1px solid rgba(18, 26, 22, 0.06);
    }

    .t-line:last-child { border-bottom: 0; }

    .t-line .n {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding-top: 0.35rem;
      user-select: none;
    }

    .t-line .t {
      font-family: var(--font-bn);
      font-size: clamp(1.2rem, 1.6vw, 1.45rem);
      font-weight: 500;
      line-height: 2.05;
      color: var(--ink);
      letter-spacing: 0.01em;
    }

    .site-footer {
      padding: 0.7rem 1.25rem;
      text-align: center;
      background: var(--panel);
      border-top: 1px solid var(--rule);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      color: var(--muted);
    }

    .site-footer a {
      color: var(--accent-deep);
      font-weight: 650;
      text-decoration: none;
    }

    .site-footer a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .top {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem 1.15rem;
      }
      .top-actions {
        justify-content: stretch;
        width: 100%;
      }
      .api-wrap {
        flex: 1;
        width: 100%;
      }
      .api-wrap input {
        width: 100%;
        min-width: 0;
      }
      .action-group {
        width: 100%;
        justify-content: stretch;
      }
      .action-group .btn {
        flex: 1;
        text-align: center;
      }
      .compare {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(280px, 42vh) 1fr;
      }
      .col + .col { border-left: 0; border-top: 1px solid var(--rule); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">ব</div>
        <div>
          <h1>BN-<em>HTR</em></h1>
          <span>Bangla handwriting recognition</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="api-wrap">
          <label for="baseUrl">API</label>
          <input id="baseUrl" type="url" spellcheck="false" autocomplete="off" placeholder="Local" aria-label="API base URL" />
          <button class="btn btn-ghost" id="testBtn" type="button">Test</button>
        </div>
        <div class="action-group">
          <button class="btn btn-primary" id="runBtn" disabled>Recognize</button>
          <button class="btn btn-ghost" id="copyBtn" type="button" disabled>Copy</button>
          <button class="btn btn-ghost" id="clearBtn" disabled>Clear</button>
        </div>
      </div>
    </header>
    <div class="status" id="status" aria-live="polite"></div>

    <section class="compare" aria-label="Compare source and transcript">
      <div class="col">
        <div class="col-label">
          <strong>Handwriting</strong>
          <em id="fileMeta">Drop or choose an image</em>
        </div>
        <div class="col-body" id="sourceBody">
          <div class="drop" id="dropzone" tabindex="0" role="button" aria-label="Choose image">
            <input id="file" type="file" accept="image/*" />
            <div class="drop-idle" id="dropIdle">
              <div class="drop-card">
                <div class="drop-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M9 12.5V3.5M9 3.5L5.5 7M9 3.5L12.5 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 12.5V14.2C3 14.9 3.6 15.5 4.3 15.5H13.7C14.4 15.5 15 14.9 15 14.2V12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  </svg>
                </div>
                <strong>Drop a page or a line</strong>
                <span>JPG or PNG. Recognition starts when you press Recognize.</span>
              </div>
            </div>
            <div class="preview" id="preview">
              <img id="previewImg" alt="Handwritten source" />
            </div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="col-label">
          <strong>Transcript</strong>
          <em id="resultMeta">Waiting for recognition</em>
        </div>
        <div class="col-body" id="readerBody">
          <div class="reader-empty" id="outputEmpty">
            Recognized text appears here as a readable line-by-line transcript.
          </div>
          <div class="transcript" id="transcript"></div>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      Developed by
      <a href="https://muddasirfaiyaj.dev/" target="_blank" rel="noopener noreferrer">Muddasir Faiyaj</a>
    </footer>
  </div>

  <script>
    const DEFAULT_BASE_URL = "";
    const BASE_URL_STORAGE_KEY = "bn-htr-api-base-url-v2";

    const state = { file: null, lastText: "", apiKind: null };

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file");
    const dropIdle = document.getElementById("dropIdle");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const fileMeta = document.getElementById("fileMeta");
    const resultMeta = document.getElementById("resultMeta");
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const testBtn = document.getElementById("testBtn");
    const baseUrlInput = document.getElementById("baseUrl");
    const statusEl = document.getElementById("status");
    const outputEmpty = document.getElementById("outputEmpty");
    const transcript = document.getElementById("transcript");

    function normalizeBaseUrl(value) {
      let v = (value || "").trim().replace(/\/+$/, "");
      if (!v) return "";
      v = v.replace(/^ttps:\/\//i, "https://");
      v = v.replace(/^ttp:\/\//i, "http://");
      if (!/^https?:\/\//i.test(v)) v = `https://${v}`;
      return v.replace(/\/+$/, "");
    }

    function getBaseUrl() {
      return normalizeBaseUrl(baseUrlInput.value);
    }

    function apiUrl(path) {
      const base = getBaseUrl();
      const p = path.startsWith("/") ? path : `/${path}`;
      return base ? `${base}${p}` : p;
    }

    function looksLikeHfSpace(base) {
      if (!base) return /\.hf\.space$/i.test(location.hostname);
      try {
        const host = new URL(base).hostname;
        return /\.hf\.space$/i.test(host) || /huggingface\.co$/i.test(host);
      } catch (_) {
        return /hf\.space/i.test(base);
      }
    }

    function loadSavedBaseUrl() {
      let saved = null;
      try { saved = localStorage.getItem(BASE_URL_STORAGE_KEY); } catch (_) {}
      baseUrlInput.value = normalizeBaseUrl(saved !== null ? saved : DEFAULT_BASE_URL);
    }

    function persistBaseUrl() {
      const v = normalizeBaseUrl(baseUrlInput.value);
      baseUrlInput.value = v;
      try { localStorage.setItem(BASE_URL_STORAGE_KEY, v); } catch (_) {}
    }

    loadSavedBaseUrl();
    baseUrlInput.addEventListener("change", () => { state.apiKind = null; persistBaseUrl(); });
    baseUrlInput.addEventListener("blur", () => { state.apiKind = null; persistBaseUrl(); });

    function setStatus(msg, kind = "") {
      statusEl.replaceChildren();
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function resetTranscript() {
      transcript.innerHTML = "";
      transcript.classList.remove("show");
      outputEmpty.classList.remove("hidden");
      resultMeta.textContent = "Waiting for recognition";
      copyBtn.disabled = true;
      state.lastText = "";
    }

    function renderTranscript(lines, meta) {
      transcript.innerHTML = "";
      lines.forEach((line, i) => {
        const row = document.createElement("div");
        row.className = "t-line";
        row.innerHTML = `<div class="n">${i + 1}</div><div class="t"></div>`;
        row.querySelector(".t").textContent = line || "—";
        transcript.appendChild(row);
      });
      outputEmpty.classList.add("hidden");
      transcript.classList.add("show");
      resultMeta.textContent = meta;
      copyBtn.disabled = !state.lastText;
    }

    function setFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please choose an image file.", "error");
        return;
      }
      state.file = file;
      const url = URL.createObjectURL(file);
      previewImg.onload = () => URL.revokeObjectURL(url);
      previewImg.src = url;
      fileMeta.textContent = `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
      dropIdle.style.display = "none";
      preview.classList.add("show");
      runBtn.disabled = false;
      clearBtn.disabled = false;
      resetTranscript();
      setStatus("Ready to recognize.");
    }

    function clearAll() {
      state.file = null;
      fileInput.value = "";
      previewImg.removeAttribute("src");
      preview.classList.remove("show");
      dropIdle.style.display = "";
      fileMeta.textContent = "Drop or choose an image";
      runBtn.disabled = true;
      clearBtn.disabled = true;
      resetTranscript();
      setStatus("");
    }

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    ["dragenter", "dragover"].forEach((ev) => {
      dropzone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach((ev) => {
      dropzone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
      });
    });
    dropzone.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });

    clearBtn.addEventListener("click", clearAll);

    async function readJsonOrThrow(res, label) {
      const text = await res.text();
      const ctype = (res.headers.get("content-type") || "").toLowerCase();
      if (!ctype.includes("application/json") && text.trimStart().startsWith("<")) {
        throw new Error(`${label} returned HTML, not JSON. Check the API URL.`);
      }
      let data;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (_) {
        throw new Error(`${label} returned non-JSON (${res.status}).`);
      }
      if (!res.ok) {
        const msg = (data && (data.error || data.detail)) || `${label} failed (${res.status})`;
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      return data;
    }

    async function tryFlask() {
      const healthRes = await fetch(apiUrl("/health"));
      const ctype = (healthRes.headers.get("content-type") || "").toLowerCase();
      if (!healthRes.ok || !ctype.includes("application/json")) return null;
      return "flask";
    }

    async function tryGradio() {
      const infoRes = await fetch(apiUrl("/gradio_api/info"));
      const ctype = (infoRes.headers.get("content-type") || "").toLowerCase();
      if (!infoRes.ok || !ctype.includes("application/json")) return null;
      return "gradio";
    }

    async function detectApiKind(force = false) {
      if (!force && state.apiKind) return state.apiKind;
      const order = looksLikeHfSpace(getBaseUrl())
        ? [tryGradio, tryFlask]
        : [tryFlask, tryGradio];
      for (const probe of order) {
        try {
          const kind = await probe();
          if (kind) {
            state.apiKind = kind;
            return kind;
          }
        } catch (_) {}
      }
      state.apiKind = null;
      throw new Error("Could not reach BN-HTR. Leave API URL empty for local, or paste your HF Space URL.");
    }

    async function uploadToGradio(file) {
      const form = new FormData();
      form.append("files", file, file.name || "image.jpg");
      const res = await fetch(apiUrl("/gradio_api/upload"), { method: "POST", body: form });
      const paths = await readJsonOrThrow(res, "Gradio upload");
      const path = Array.isArray(paths) ? paths[0] : paths;
      if (!path) throw new Error("Gradio upload returned no file path");
      return path;
    }

    async function callGradio(endpoint, fileData) {
      const callRes = await fetch(apiUrl(`/gradio_api/call/v2/${endpoint}`), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image_path: {
            path: fileData,
            meta: { _type: "gradio.FileData" },
            orig_name: state.file.name || "image.jpg",
          },
        }),
      });
      const callData = await readJsonOrThrow(callRes, "Gradio call");
      const eventId = callData.event_id;
      if (!eventId) throw new Error("Gradio call did not return event_id");

      const pollRes = await fetch(apiUrl(`/gradio_api/call/${endpoint}/${eventId}`));
      if (!pollRes.ok) throw new Error(`Gradio poll failed (${pollRes.status})`);
      const body = await pollRes.text();
      const blocks = body.split(/\n\n+/);
      let payload = null;
      let sawError = null;
      for (const block of blocks) {
        const lines = block.split(/\n/);
        let event = "message";
        let dataLine = "";
        for (const line of lines) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          if (line.startsWith("data:")) dataLine += line.slice(5).trim();
        }
        if (event === "error") {
          try { sawError = JSON.parse(dataLine); }
          catch (_) { sawError = dataLine || "Gradio error"; }
        }
        if (event === "complete" && dataLine) payload = JSON.parse(dataLine);
      }
      if (sawError) {
        const msg = typeof sawError === "string"
          ? sawError
          : sawError.error || sawError.message || JSON.stringify(sawError);
        throw new Error(msg);
      }
      if (payload == null) throw new Error("Gradio did not return a result. Wake the Space and retry.");
      const text = Array.isArray(payload) ? payload[0] : payload;
      return typeof text === "string" ? text : String(text ?? "");
    }

    async function recognizeViaGradio() {
      const uploaded = await uploadToGradio(state.file);
      const text = await callGradio("recognize", uploaded);
      const lines = String(text || "").split("\n");
      return {
        lines,
        full_text: text,
        line_count: lines.filter((l) => l.length).length || lines.length,
      };
    }

    async function recognizeViaFlask() {
      const form = new FormData();
      form.append("image", state.file);
      const res = await fetch(apiUrl("/recognize"), { method: "POST", body: form });
      return readJsonOrThrow(res, "Recognize");
    }

    testBtn.addEventListener("click", async () => {
      persistBaseUrl();
      state.apiKind = null;
      setStatus("Checking API…", "busy");
      try {
        const kind = await detectApiKind(true);
        if (kind === "flask") {
          const data = await readJsonOrThrow(await fetch(apiUrl("/health")), "Health");
          setStatus(`Connected · Flask · ${data.device || "unknown"}`);
        } else {
          const data = await readJsonOrThrow(await fetch(apiUrl("/gradio_api/info")), "Gradio");
          const endpoints = Object.keys(data.named_endpoints || {}).join(", ") || "ok";
          setStatus(`Connected · Gradio · ${endpoints}`);
        }
      } catch (err) {
        setStatus(err.message || "Could not reach API.", "error");
      }
    });

    function copyTextFallback(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.readOnly = false;
      // Must be in-document and selectable; tiny/hidden nodes often fail on HTTP
      ta.style.cssText =
        "position:fixed;top:50%;left:50%;width:240px;height:80px;" +
        "opacity:0.01;z-index:99999;border:none;padding:0;margin:0;";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (_) {
        ok = false;
      }
      document.body.removeChild(ta);
      return ok;
    }

    async function copyText(text) {
      // Prefer Clipboard API when available (works on localhost / HTTPS)
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) { /* LAN HTTP often blocks this — use fallback */ }
      }
      return copyTextFallback(text);
    }

    copyBtn.addEventListener("click", async () => {
      if (!state.lastText) return;
      const ok = await copyText(state.lastText);
      if (ok) {
        setStatus("Copied transcript.");
      } else {
        // Last resort: select transcript so user can Ctrl+C
        const range = document.createRange();
        range.selectNodeContents(transcript);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        setStatus("Selected transcript — press Ctrl+C to copy.");
      }
    });

    runBtn.addEventListener("click", async () => {
      if (!state.file) return;
      persistBaseUrl();
      runBtn.disabled = true;
      clearBtn.disabled = true;
      setStatus("Recognizing…", "busy");
      resetTranscript();

      try {
        const kind = await detectApiKind();
        const data = kind === "gradio"
          ? await recognizeViaGradio()
          : await recognizeViaFlask();

        const lines = data.lines || (data.text != null ? [data.text] : []);
        state.lastText = data.full_text || data.text || lines.join("\n");
        const count = data.line_count != null ? data.line_count : lines.length;
        const unsure = Array.isArray(data.uncertain) && data.uncertain.some(Boolean);
        const lineLabel = `${count} line${count === 1 ? "" : "s"}`;
        renderTranscript(lines, unsure ? `${lineLabel} · review` : lineLabel);
        setStatus("");
      } catch (err) {
        setStatus(err.message || "Something went wrong.", "error");
      } finally {
        runBtn.disabled = !state.file;
        clearBtn.disabled = !state.file;
      }
    });
  </script>
</body>
</html>
